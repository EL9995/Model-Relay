<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model Relay</title>
<style>
  :root {
    --bg: #f6f5f1; --surface: #ffffff; --ink: #1d1d1b; --muted: #6b6a64; --line: #e2e0d8;
    --accent: #2f6fdb; --accent-soft: #e6eefc; --up: #1f8a5b; --up-soft: #e3f4ec;
    --warn: #b7600b; --warn-soft: #fbeedd; --bad: #c0392b; --bad-soft: #fbe5e2;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141414; --surface: #1e1e1d; --ink: #ecebe6; --muted: #9a998f; --line: #34332f;
      --accent: #6c9cf0; --accent-soft: #1d2a40; --up: #4cc08a; --up-soft: #16302a;
      --warn: #e59a4a; --warn-soft: #3a2a17; --bad: #ef6b5b; --bad-soft: #3d1d1a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  button { font: inherit; font-weight: 600; padding: 8px 18px; border: 0; border-radius: 8px;
           background: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  button.ghost { background: none; color: var(--muted); border: 1px solid var(--line);
                 padding: 3px 10px; font-size: 12px; font-weight: 500; }
  button.ghost:hover { color: var(--ink); }
  select { font: inherit; font-size: 13px; padding: 6px 8px; border-radius: 8px;
           border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---- header: title + mode tabs ---- */
  header { border-bottom: 1px solid var(--line); background: var(--surface); }
  .bar { max-width: 1160px; margin: 0 auto; padding: 14px 16px; display: flex; flex-wrap: wrap;
         align-items: center; gap: 12px 24px; }
  h1 { font-size: 18px; margin: 0; letter-spacing: -0.01em; }
  .tabs { display: inline-flex; gap: 4px; background: var(--bg); border: 1px solid var(--line);
          border-radius: 10px; padding: 3px; }
  .tabs button { background: none; color: var(--muted); padding: 5px 16px; font-size: 14px; border-radius: 7px; }
  .tabs button[aria-selected=true] { background: var(--surface); color: var(--ink);
          box-shadow: 0 1px 2px rgba(0,0,0,.12); }

  /* ---- layout: sidebar + main; one column on narrow screens ---- */
  .layout { max-width: 1160px; margin: 0 auto; padding: 20px 16px 80px; display: grid; gap: 20px;
            grid-template-columns: 320px minmax(0, 1fr); grid-template-rows: auto 1fr;
            grid-template-areas: "side compose" "side stage"; align-items: start; }
  .side { grid-area: side; display: grid; gap: 12px; position: sticky; top: 16px; }
  #form { grid-area: compose; }
  .stagewrap { grid-area: stage; }
  @media (max-width: 860px) {
    .layout { grid-template-columns: minmax(0, 1fr); grid-template-areas: "compose" "side" "stage"; }
    .side { position: static; }
  }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .panel[hidden] { display: none; }
  .phead { display: flex; align-items: center; gap: 6px; }
  .phead h2 { font-size: 14px; margin: 0; flex: 1; }
  .phint { font-size: 12px; color: var(--muted); margin: 4px 0 10px; }

  /* ---- chain list ---- */
  .chainlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .row { display: grid; grid-template-columns: auto auto 1fr auto auto; align-items: center; gap: 8px;
         padding: 7px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg);
         cursor: grab; user-select: none; touch-action: none; position: relative;
         transition: transform .18s cubic-bezier(.2, .8, .2, 1), box-shadow .15s; }
  .row .grip { color: var(--muted); letter-spacing: -2px; }
  .row .n { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; width: 1.2em; text-align: right; }
  .row .name { font-family: var(--mono); font-size: 13px; font-weight: 600; min-width: 0;
               overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .name small { display: block; font-family: inherit; font-weight: 400; font-size: 11px; color: var(--muted); }
  .row button { background: none; color: var(--muted); font-weight: 500; font-size: 12px; padding: 2px 6px; }
  .row button:hover { color: var(--ink); }
  .row .sabbtn { border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; font-size: 11px; }
  .row .sabbtn[aria-pressed=true] { background: var(--bad); border-color: var(--bad); color: #fff; }
  .row.sab { border-color: var(--bad); background: var(--bad-soft); }
  .row.lifted { z-index: 2; cursor: grabbing; transition: box-shadow .15s;
               box-shadow: 0 10px 24px rgba(0, 0, 0, .28); border-color: var(--accent); }
  @media (prefers-reduced-motion: reduce) { .row, .row.lifted { transition: none; } }
  .row:focus-visible { outline-offset: 1px; }
  #add { width: 100%; margin-top: 8px; }
  .mem { font-size: 12px; color: var(--muted); margin: 10px 0 0; }
  .mem.tight { color: var(--warn); }

  /* ---- composer ---- */
  .hint { font-size: 13px; color: var(--muted); margin: 0 0 12px; }
  .field { display: block; margin-bottom: 10px; }
  .field > span { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
  .field > span em { font-style: normal; font-weight: 400; }
  textarea { width: 100%; font: inherit; color: var(--ink); resize: none; display: block; overflow-y: auto; }
  #rule { font-size: 14px; padding: 8px 12px; border-radius: 8px; border: 1px dashed var(--line); background: var(--bg); }
  .prompt { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 10px 12px 8px; }
  .prompt:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  #task { border: 0; background: none; font-size: 16px; line-height: 1.5; padding: 2px 0; }
  #task:focus-visible { outline: none; }
  .pfoot { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
  .pfoot span { flex: 1; font-size: 12px; color: var(--muted); }

  .banner { margin-top: 12px; padding: 10px 14px; border-radius: 8px; background: var(--warn-soft);
            color: var(--warn); display: none; }
  .banner.show { display: block; }

  /* ---- saved runs ---- */
  .history { padding: 0; }
  .history summary { padding: 12px 14px; cursor: pointer; font-weight: 600; font-size: 14px; }
  .history summary span { color: var(--muted); font-weight: 400; }
  .history ol { list-style: none; margin: 0; padding: 0 6px 6px; max-height: 340px; overflow-y: auto; }
  .history li button { all: unset; box-sizing: border-box; width: 100%; display: grid; cursor: pointer;
          grid-template-columns: auto 1fr; gap: 2px 8px; padding: 8px; border-radius: 8px; font-size: 13px; }
  .history li button:hover, .history li button:focus-visible { background: var(--bg); }
  .history li button.current { background: var(--accent-soft); }
  .history .q { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .history .a { color: var(--muted); font-size: 12px; grid-column: 1 / 3; overflow: hidden;
          text-overflow: ellipsis; white-space: nowrap; }
  .tag { font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px;
         background: var(--accent-soft); color: var(--accent); align-self: center; }
  .tag.blind { background: var(--up-soft); color: var(--up); }
  .tag.cipher { background: var(--warn-soft); color: var(--warn); }
  .tag.sab { background: var(--bad-soft); color: var(--bad); }
  .empty { color: var(--muted); font-size: 13px; padding: 4px 8px 8px; }

  /* ---- stage ---- */
  .stagewrap:empty { display: none; }
  .node { background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
          padding: 12px 16px; transition: border-color .2s, box-shadow .2s; }
  .node.sab { border-color: var(--bad); }
  .node.active { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .node.sab.active { border-color: var(--bad); box-shadow: 0 0 0 3px var(--bad-soft); }
  .head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .layer { font-size: 12px; color: var(--muted); }
  .model { font-family: var(--mono); font-weight: 600; }
  .role { font-size: 12px; color: var(--muted); }
  .status { margin-left: auto; font-size: 12px; color: var(--muted); }
  .node.active .status { color: var(--accent); }
  .node.sab.active .status { color: var(--bad); }
  .node.active .status::before { content: ""; display: inline-block; width: 7px; height: 7px;
          border-radius: 50%; background: currentColor; margin-right: 6px; animation: blink 1s infinite; }
  .msg { margin-top: 10px; padding: 8px 12px; border-radius: 8px; display: none; }
  .msg.show { display: block; animation: pop .25s ease-out; }
  .msg .lbl { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
              display: flex; flex-wrap: wrap; gap: 8px; }
  .msg .lbl span:last-child:not(:first-child) { margin-left: auto; font-weight: 400; text-transform: none;
              letter-spacing: 0; font-family: var(--mono); }
  .msg .txt { white-space: pre-wrap; word-break: break-word; }
  .msg .txt.code { font-family: var(--mono); font-size: 14px; }
  .msg.down { background: var(--accent-soft); } .msg.down .lbl { color: var(--accent); }
  .msg.up { background: var(--up-soft); } .msg.up .lbl { color: var(--up); }
  .msg.fixed { background: var(--warn-soft); } .msg.fixed .lbl { color: var(--warn); }
  .msg.bad { background: var(--bad-soft); } .msg.bad .lbl { color: var(--bad); }
  .note { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .you .txt { font-size: 16px; }
  .final { font-size: 20px; font-weight: 600; }
  .verdict { font-weight: 600; margin-top: 6px; }
  .verdict.good { color: var(--up); } .verdict.bad { color: var(--bad); }
  .stats { font-size: 13px; color: var(--muted); margin-top: 6px; }

  /* folding a card down to one line per message */
  .stagebar { display: flex; justify-content: flex-end; gap: 6px; margin-bottom: 10px; }
  .node .head.fold { cursor: pointer; }
  .fold-btn { background: none; color: var(--muted); padding: 0 4px; font-size: 14px; font-weight: 400;
              line-height: 1; transition: transform .15s; }
  .fold-btn:hover { color: var(--ink); }
  .node.collapsed .fold-btn { transform: rotate(-90deg); }
  .node.collapsed .msg { padding: 5px 12px; margin-top: 6px; }
  .node.collapsed .msg .txt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
  .node.collapsed .note { display: none; }

  .wire { position: relative; height: 32px; margin-left: 32px; width: 2px; background: var(--line); }
  .wire i { position: absolute; left: -4px; width: 10px; height: 10px; border-radius: 50%; opacity: 0; top: 0; }
  .wire.down i { background: var(--accent); opacity: 1; animation: down .9s linear infinite; }
  .wire.up i { background: var(--up); opacity: 1; animation: up .9s linear infinite; }
  @keyframes down { from { top: -5px; } to { top: 27px; } }
  @keyframes up { from { top: 27px; } to { top: -5px; } }
  @keyframes blink { 50% { opacity: .2; } }
  @keyframes pop { from { opacity: 0; transform: translateY(-4px); } }
  @media (prefers-reduced-motion: reduce) {
    .wire i, .node.active .status::before, .msg.show { animation: none; }
    .wire.down i, .wire.up i { top: 11px; }
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>Model Relay</h1>
    <div class="tabs" role="tablist" aria-label="Mode">
      <button type="button" role="tab" data-mode="relay">Relay</button>
      <button type="button" role="tab" data-mode="blind">Blind</button>
      <button type="button" role="tab" data-mode="cipher">Cipher</button>
    </div>
  </div>
</header>

<div class="layout">
  <form id="form">
    <p class="hint" id="hint"></p>
    <label class="field"><span>Rule for every model <em>· optional</em></span>
      <textarea id="rule" rows="1" placeholder="e.g. Answer in one sentence."></textarea>
    </label>
    <div class="prompt">
      <textarea id="task" rows="2" aria-label="Prompt"></textarea>
      <div class="pfoot">
        <span>Enter to run · Shift+Enter for a new line</span>
        <button id="go">Run</button>
      </div>
    </div>
    <div class="banner" id="banner"></div>
  </form>

  <aside class="side">
    <section class="panel">
      <div class="phead">
        <h2>Chain</h2>
        <button type="button" class="ghost" id="sortBig">Biggest first</button>
        <button type="button" class="ghost" id="flip">Flip</button>
      </div>
      <p class="phint" id="chainHint"></p>
      <ol class="chainlist" id="chain"></ol>
      <select id="add" aria-label="Add a model"></select>
      <p class="mem" id="mem"></p>
    </section>
    <section class="panel" id="cipherPanel" hidden>
      <div class="phead"><h2>Cipher</h2></div>
      <p class="phint">How the message is encoded at each step down.</p>
      <select id="cipher" style="width:100%">
        <option value="base64">base64</option>
        <option value="rot13">ROT13</option>
        <option value="caesar">Caesar +3</option>
        <option value="reverse">Reverse</option>
        <option value="mix">Mix: a different cipher each step</option>
      </select>
    </section>
    <details class="panel history">
      <summary>Saved runs <span id="hcount"></span></summary>
      <ol id="hlist"></ol>
    </details>
  </aside>

  <div class="stagewrap" id="stage"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
};
let installed = [], chain = [], ramGb = 0, running = false, openId = null;
let current = "relay", saboteur = null;  // saboteur is a model name, so it follows the model when you reorder
const gb = name => (installed.find(m => m.name === name) || {}).gb || 0;
const CNAME = { base64: "base64", rot13: "ROT13", caesar: "Caesar +3", reverse: "reverse", mix: "mix" };

function warn(text) { $("#banner").textContent = text; $("#banner").classList.toggle("show", !!text); }

// ---- text boxes grow with what you type ----
function grow(t, max) { t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight + 2, max) + "px"; }
$("#task").oninput = () => grow($("#task"), 260);
$("#rule").oninput = () => grow($("#rule"), 120);
$("#task").onkeydown = e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("#form").requestSubmit(); }
};
$("#rule").onkeydown = e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("#task").focus(); }
};

// ---- modes ----
const MODES = {
  relay: { hint: "Each model rewrites the task for the one below. The bottom one answers, and each layer checks it on the way back up.",
           placeholder: "Ask something… e.g. What is 7 times 8?",
           chain: "Top to bottom. Drag to reorder. Turn on Saboteur for a model to have it plant a wrong answer." },
  blind: { hint: "Every model gets your prompt word for word and answers on its own. None sees another's answer.",
           placeholder: "Ask something… e.g. How many r's are in strawberry?",
           chain: "The models answer one at a time, in this order. Drag to reorder." },
  cipher: { hint: "Your message is encoded and passed down. Each model decodes it and re-encodes it for the next, and the tool checks every step.",
            placeholder: "A secret message… e.g. meet at noon",
            chain: "Top to bottom. Drag to reorder." },
};
function setMode(m) {
  current = m;
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.mode === m));
  $("#hint").textContent = MODES[m].hint;
  $("#task").placeholder = MODES[m].placeholder;
  $("#cipherPanel").hidden = m !== "cipher";
  renderChain();
}
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => setMode(b.dataset.mode));

// ---- chain: a vertical list in any order; drag with pointer events so mouse and touch both work ----
function move(from, to) {
  if (to < 0 || to >= chain.length || from === to) return false;
  const [m] = chain.splice(from, 1); chain.splice(to, 0, m);
  renderChain();
  return true;
}
function remove(i) {
  if (chain.length < 2) return;
  if (chain[i] === saboteur) saboteur = null;
  chain.splice(i, 1); renderChain();
}
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
let settling = false;
function renderChain() {
  $("#chainHint").textContent = MODES[current].chain;
  const list = $("#chain"), before = {};
  list.querySelectorAll(".row").forEach(r => before[r.dataset.name] = r.getBoundingClientRect().top);
  list.replaceChildren();
  chain.forEach((name, i) => {
    const row = el("li", "row" + (current === "relay" && name === saboteur ? " sab" : ""));
    row.tabIndex = 0; row.dataset.i = i; row.dataset.name = name;
    row.setAttribute("aria-label", `Layer ${i + 1}: ${name}. Arrow keys move it, Delete removes it.`);
    const label = el("span", "name", name); label.append(el("small", null, `${gb(name)} GB`));
    row.append(el("span", "grip", "⋮⋮"), el("span", "n", `${i + 1}`), label);
    if (current === "relay") {
      const s = el("button", "sabbtn", "Saboteur"); s.type = "button";
      s.setAttribute("aria-pressed", name === saboteur);
      s.title = "Make this model secretly plant a wrong answer";
      s.onclick = () => { saboteur = saboteur === name ? null : name; renderChain(); };
      row.append(s);
    } else row.append(el("span"));
    const x = el("button", null, "✕"); x.type = "button"; x.title = "Remove"; x.disabled = chain.length < 2;
    x.onclick = () => remove(i);
    row.append(x);
    row.onpointerdown = e => drag(e, row, i);
    row.onkeydown = e => {
      if (e.target !== row) return;
      const d = { ArrowUp: -1, ArrowLeft: -1, ArrowDown: 1, ArrowRight: 1 }[e.key];
      if (d) { e.preventDefault(); if (move(i, i + d)) $("#chain").children[i + d].focus(); }
      if (e.key === "Delete" || e.key === "Backspace") remove(i);
    };
    list.append(row);
  });
  // slide every row from where it was to where it is now
  if (!reduceMotion) list.querySelectorAll(".row").forEach(r => {
    const d = (before[r.dataset.name] ?? r.getBoundingClientRect().top) - r.getBoundingClientRect().top;
    if (!d) return;
    r.style.transition = "none"; r.style.transform = `translateY(${d}px)`;
    void r.offsetHeight;
    r.style.transition = ""; r.style.transform = "";
  });

  const add = $("#add"), rest = installed.filter(m => !chain.includes(m.name));
  const first = el("option", null, rest.length ? "+ Add a model" : "All installed models are in the chain");
  first.value = ""; add.replaceChildren(first);
  rest.forEach(m => { const o = el("option", null, `${m.name} · ${m.gb} GB`); o.value = m.name; add.append(o); });
  add.disabled = !rest.length;

  const total = chain.reduce((t, n) => t + gb(n), 0), tight = ramGb && total > ramGb * 0.6;
  $("#mem").textContent = `${chain.length} models · ${total.toFixed(1)} GB` + (ramGb ? ` · your Mac has ${ramGb} GB` : "") +
    (tight ? ". Not all of them fit in memory at once, so they'll take turns loading, which is slower." : "");
  $("#mem").classList.toggle("tight", !!tight);
}
$("#add").onchange = e => { if (e.target.value) { chain.push(e.target.value); renderChain(); } };
$("#sortBig").onclick = () => { chain.sort((a, b) => gb(b) - gb(a)); renderChain(); };
$("#flip").onclick = () => { chain.reverse(); renderChain(); };

function drag(e, row, from) {
  if (e.button !== 0 || e.target.closest("button") || settling) return;
  const rows = [...$("#chain").children], tops = rows.map(r => r.getBoundingClientRect().top);
  const step = rows.length > 1 ? tops[1] - tops[0] : 0;  // rows are all the same height
  const x0 = e.clientX, y0 = e.clientY;
  let to = from, moved = false;
  row.setPointerCapture(e.pointerId);
  const onMove = ev => {
    if (!moved && Math.hypot(ev.clientX - x0, ev.clientY - y0) < 4) return;  // still a click
    if (!moved) { moved = true; row.classList.add("lifted"); }
    const dy = Math.max(tops[0] - tops[from] - step / 3,
                        Math.min(tops[tops.length - 1] - tops[from] + step / 3, ev.clientY - y0));
    row.style.transform = `translateY(${dy}px)`;
    to = step ? Math.max(0, Math.min(rows.length - 1, from + Math.round(dy / step))) : from;
    rows.forEach((r, j) => {
      if (r === row) return;
      const shift = from < to && j > from && j <= to ? -step : to < from && j >= to && j < from ? step : 0;
      r.style.transform = shift ? `translateY(${shift}px)` : "";
    });
  };
  const onUp = () => {
    row.removeEventListener("pointermove", onMove);
    if (!moved) return;
    settling = true;
    row.classList.remove("lifted");  // brings the transition back, so it eases into the slot
    row.style.transform = `translateY(${tops[to] - tops[from]}px)`;
    setTimeout(() => {
      if (to !== from) { const [m] = chain.splice(from, 1); chain.splice(to, 0, m); }
      renderChain();
      settling = false;
    }, reduceMotion ? 0 : 180);
  };
  row.addEventListener("pointermove", onMove);
  row.addEventListener("pointerup", onUp, { once: true });
  row.addEventListener("pointercancel", onUp, { once: true });
}

// ---- the stage: You at the top, one card per model, a wire above each card ----
let nodes = [], wires = [], you, planted = null;
function renderStage(task, rule, runChain, runMode, sabLayer) {
  const stage = $("#stage"); stage.replaceChildren(); nodes = []; wires = []; planted = null;
  const bar = el("div", "stagebar");
  const all = (fold, text) => { const b = el("button", "ghost", text); b.type = "button";
    b.onclick = () => nodes.forEach(n => setFolded(n, fold)); return b; };
  bar.append(all(true, "Collapse all"), all(false, "Expand all"));
  stage.append(bar);
  you = el("div", "node you");
  const h = el("div", "head"); h.append(el("span", "model", "You"), el("span", "status", ""));
  you.append(h);
  if (rule) { const r = el("div", "msg down show"); r.append(lbl("Rule for every model"), el("div", "txt", rule)); you.append(r); }
  const m = el("div", "msg down show");
  m.append(lbl(runMode === "cipher" ? "Secret message" : "Prompt"), el("div", "txt", task));
  you.append(m);
  you.enc = el("div", "msg down"); you.answer = el("div", "msg up");
  you.append(you.enc, you.answer);
  stage.append(you);

  runChain.forEach((name, i) => {
    const w = el("div", "wire"); w.append(el("i")); wires.push(w); stage.append(w);
    const bottom = i === runChain.length - 1;
    const role = { relay: bottom ? "answers" : "rewrites ↓ · checks ↑", blind: "answers on its own",
                   cipher: bottom ? "decodes" : "decodes · re-encodes ↓" }[runMode];
    const n = el("div", "node");
    const head = el("div", "head");
    head.append(el("span", "layer", `Layer ${i + 1}`), el("span", "model", name), el("span", "role", role));
    if (sabLayer === i) { n.classList.add("sab"); head.append(el("span", "tag sab", "saboteur")); }
    n.status = el("span", "status", "waiting"); head.append(n.status);
    n.fold = el("button", "fold-btn", "▾"); n.fold.type = "button";
    n.fold.setAttribute("aria-label", `Collapse layer ${i + 1}`); n.fold.setAttribute("aria-expanded", "true");
    head.append(n.fold); head.classList.add("fold");
    head.onclick = () => setFolded(n, !n.classList.contains("collapsed"));
    n.down = el("div", "msg down"); n.up = el("div", "msg up");
    n.append(head, n.down, n.up);
    nodes.push(n); stage.append(n);
  });
}

function setFolded(n, fold) {
  n.classList.toggle("collapsed", fold);
  n.fold.setAttribute("aria-expanded", String(!fold));
  n.fold.setAttribute("aria-label", (fold ? "Expand" : "Collapse") + n.fold.getAttribute("aria-label").replace(/^\w+/, ""));
}

function lbl(text, meta) {
  const l = el("div", "lbl"); l.append(el("span", null, text));
  if (meta) l.append(el("span", null, meta));
  return l;
}
function fill(box, label, meta, text, opts = {}) {
  box.replaceChildren(lbl(label, meta), el("div", "txt" + (opts.code ? " code" : ""), text));
  (opts.notes || []).filter(Boolean).forEach(nt => box.append(el("div", "note", nt)));
  box.classList.remove("bad", "fixed");
  if (opts.tone) box.classList.add(opts.tone);
  box.classList.add("show");
}
function flow(i, dir) { wires.forEach(w => w.className = "wire"); if (dir && wires[i]) wires[i].classList.add(dir); }
function busy(i, text) {
  nodes.forEach(n => n.classList.remove("active"));
  if (i == null) return;
  nodes[i].classList.add("active"); nodes[i].status.textContent = text;
  nodes[i].scrollIntoView({ block: "nearest", behavior: "smooth" });
}
const mark = ok => ok === true ? "✓" : ok === false ? "✗" : "?";

function handle(e) {
  const n = nodes[e.layer];
  if (e.type === "start") {
    fill(you.enc, `Encoded by the tool · ${CNAME[e.cipher]}`, null, e.sent, { code: true });
  } else if (e.type === "call") {
    const sab = n.classList.contains("sab");
    if (e.dir === "down") { flow(e.layer, "down"); busy(e.layer, "rewriting the task…"); }
    if (e.dir === "answer") { flow(e.layer, "down"); busy(e.layer, sab ? "plotting…" : "answering…"); }
    if (e.dir === "up") { flow(e.layer + 1, "up"); busy(e.layer, sab ? "plotting…" : "checking the answer…"); }
    if (e.dir === "solo") { flow(e.layer, "down"); busy(e.layer, "answering…"); }
    if (e.dir === "decode") { flow(e.layer, "down"); busy(e.layer, "decoding…"); }
    if (e.dir === "encode") { busy(e.layer, "encoding for the next model…"); }
  } else if (e.type === "step") {
    const meta = `${e.secs}s · ${e.tok_s} tok/s` + (e.cut ? " · cut off at the token limit" : "");
    if (e.dir === "down") { fill(n.down, "↓ told the model below", meta, e.sent); n.status.textContent = "waiting for the answer"; }
    if (e.dir === "answer" || e.dir === "solo") {
      const lied = e.sabotage && e.lied !== false;  // runs saved before "lied" existed count as lies
      if (lied) planted = e.sent;
      fill(n.down, lied ? "● planted a wrong answer" : e.sabotage ? "● told to lie, answered honestly" : "● answered",
           meta, e.sent, { tone: lied ? "bad" : e.sabotage && "fixed" });
      n.status.textContent = lied ? "planted" : "done";
    }
    if (e.dir === "up") {
      if (e.sabotage && e.lied !== false) {
        planted = e.sent;
        fill(n.up, "↑ planted a wrong answer", meta, e.sent, { tone: "bad" });
        n.status.textContent = "planted";
      } else if (e.sabotage) {
        fill(n.up, "↑ told to lie, passed the honest answer", meta, e.sent, { tone: "fixed" });
        n.status.textContent = "didn't lie";
      } else if (planted != null && !e.changed) {
        fill(n.up, "↑ approved the planted answer", meta, e.sent, { tone: "bad", notes: [e.note] });
        n.status.textContent = "fooled";
      } else {
        planted = null;  // the planted answer is gone from here up
        fill(n.up, e.changed ? "↑ changed it" : "↑ passed it up", meta, e.sent, { tone: e.changed && "fixed", notes: [e.note] });
        n.status.textContent = e.changed ? "changed it" : "approved";
      }
    }
    if (e.dir === "decode" || e.dir === "encode") {
      const notes = [
        e.ok === false && `Should be: ${e.want}`,
        e.ok == null && `What it got isn't valid ${CNAME[e.cipher]}, so there's no right answer to check against.`,
        e.extra && "Added commentary after the answer; only the first paragraph was kept.",
      ];
      const box = e.dir === "decode" ? n.down : n.up;
      const label = e.dir === "decode" ? `◇ decoded ${CNAME[e.cipher]} ${mark(e.ok)}` : `◆ encoded as ${CNAME[e.cipher]} ${mark(e.ok)}`;
      fill(box, label, meta, e.sent, { code: e.dir === "encode", notes, tone: e.ok === false && "bad" });
      n.status.textContent = e.dir === "decode" ? `decoded ${mark(e.ok)}` : `encoded ${mark(e.ok)}`;
    }
    flow(null); busy(null);
  } else if (e.type === "done") {
    finish(e);
  } else if (e.type === "error") {
    flow(null); busy(null); warn("Relay failed: " + e.message);
  }
}

function finish(e) {
  const parts = [];
  if (e.mode === "blind") {
    parts.push(lbl("Done"), el("div", "stats",
      `${e.calls} models answered in ${e.secs}s · at most ${e.peak.length} in memory at once · compare their answers below`));
  } else if (e.mode === "cipher") {
    const b = e.broke_at;
    parts.push(lbl("Message at the bottom"), el("div", "final", e.answer || "(nothing)"),
      el("div", "verdict " + (e.intact ? "good" : "bad"), e.intact ? "Arrived intact ✓" : "Didn't survive ✗"));
    if (b) parts.push(el("div", "stats", `First mistake: layer ${b.layer + 1} (${b.model}) ${b.dir === "decode" ? "decoding" : "encoding"} ${CNAME[b.cipher]}` +
                                          (e.intact ? ", but the message still made it" : "")));
    parts.push(el("div", "stats", `${e.secs}s · ${e.calls} model calls · ciphers: ${e.ciphers.map(c => CNAME[c]).join(" → ")}`));
  } else {
    parts.push(lbl("Final answer"), el("div", "final", e.answer));
    const s = e.sabotage;
    if (s) {
      const [text, tone] = {
        caught: [`Saboteur caught ✓ by layer ${s.caught_by + 1} (${s.caught_by_model})` +
                 (s.final_is_honest ? "" : ", but the final answer still differs from the honest one"), "good"],
        slipped: [`Saboteur slipped through ✗ Nobody above layer ${s.layer + 1} changed "${s.planted}".`, "bad"],
        no_lie: ["The saboteur didn't lie; it gave the honest answer anyway.", ""],
      }[s.outcome];
      parts.push(el("div", "verdict " + tone, text));
      if (s.honest != null) parts.push(el("div", "stats", `Honest answer: ${s.honest} · planted: ${s.planted}`));
    }
    parts.push(el("div", "stats", `${e.secs}s · ${e.calls} model calls · at most ${e.peak.length} of ${e.chain.length} models in memory at once`));
  }
  parts.push(el("div", "stats", e.id ? `Saved ${e.time.replace("T", " ")} · runs/${e.id}.json` : "Not saved"));
  const show = () => {
    flow(null);
    you.answer.replaceChildren(...parts); you.answer.classList.add("show");
    you.scrollIntoView({ block: "nearest", behavior: "smooth" });
  };
  if (e.mode === "relay") { flow(0, "up"); setTimeout(show, 700); } else show();
}

async function run(task) {
  running = true; $("#go").disabled = true; warn("");
  const rule = $("#rule").value.trim(), m = current;
  const sab = m === "relay" && chain.includes(saboteur) ? chain.indexOf(saboteur) : null;
  openId = null;
  renderStage(task, rule, chain, m, sab);
  const params = { task, chain: chain.join(","), mode: m, rule, cipher: $("#cipher").value, saboteur: sab ?? "" };
  try {
    const res = await fetch("/run?" + new URLSearchParams(params));
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let k;
      while ((k = buf.indexOf("\n\n")) >= 0) {
        const chunk = buf.slice(0, k); buf = buf.slice(k + 2);
        if (chunk.startsWith("data: ")) handle(JSON.parse(chunk.slice(6)));
      }
    }
  } catch (err) {
    warn("Lost the connection to server.py: " + err.message);
  }
  running = false; $("#go").disabled = false;
  loadHistory();
}

$("#form").onsubmit = ev => {
  ev.preventDefault();
  const task = $("#task").value.trim();
  if (task && !running) run(task);
};

// ---- saved runs ----
function summary(r) {
  if (r.mode === "cipher") return `${CNAME[r.cipher] || r.cipher} · ${r.intact ? "intact" : "broke"} → ${r.answer}`;
  if (r.mode === "blind") return `${r.calls} answers`;
  const s = r.sabotage;
  return `→ ${r.answer}` + (s ? ` · saboteur ${{ caught: "caught", slipped: "slipped through", no_lie: "didn't lie" }[s.outcome]}` : "");
}
async function loadHistory() {
  let runs = [];
  try { runs = await (await fetch("/runs")).json(); } catch { return; }
  $("#hcount").textContent = `(${runs.length})`;
  const list = $("#hlist");
  if (!runs.length) return list.replaceChildren(el("li", "empty", "Nothing yet. Every run you do is saved here."));
  list.replaceChildren(...runs.map(r => {
    const b = el("button");
    b.className = r.id === openId ? "current" : "";
    const tag = r.sabotage ? ["sab", "saboteur"] : [r.mode === "relay" ? "" : r.mode, r.mode];
    b.append(el("span", "tag " + tag[0], tag[1]), el("span", "q", r.task),
             el("span", "a", `${r.time.slice(5, 16).replace("T", " ")} · ` + summary(r) +
                             ` · ${r.chain.length} models · ${r.secs}s` + (r.rule ? ` · rule: ${r.rule}` : "")));
    b.title = r.task;
    b.onclick = () => openRun(r.id);
    const li = el("li"); li.append(b); return li;
  }));
}

async function openRun(id) {
  if (running) return;
  const r = await (await fetch("/runs/" + encodeURIComponent(id))).json();
  openId = id; warn("");
  // put the run back in the form so Run repeats it
  $("#task").value = r.task; $("#rule").value = r.rule || "";
  grow($("#task"), 260); grow($("#rule"), 120);
  if (r.cipher) $("#cipher").value = r.cipher;
  saboteur = r.saboteur != null ? r.chain[r.saboteur] : null;
  const missing = r.chain.filter(n => !installed.some(m => m.name === n));
  if (missing.length) warn("Not installed any more: " + missing.join(", "));
  else chain = [...r.chain];
  setMode(r.mode);
  renderStage(r.task, r.rule, r.chain, r.mode, r.saboteur ?? null);
  if (r.mode === "cipher") handle({ type: "start", cipher: r.ciphers[0], sent: r.encoded });
  const honest = r.sabotage?.outcome === "no_lie";  // older runs didn't record "lied" per step
  r.trace.forEach(t => handle({ type: "step", ...t, ...(t.sabotage && t.lied === undefined ? { lied: !honest } : {}) }));
  finish(r);
  loadHistory();
}

setMode("relay");
fetch("/models").then(r => r.json()).then(d => {
  if (d.error) return warn(d.error);
  installed = d.models; ramGb = d.ram_gb || 0;
  chain = d.default.filter(n => installed.some(m => m.name === n));
  if (!chain.length && installed.length) chain = [installed[0].name];
  renderChain();
  loadHistory();
}).catch(() => warn("Can't reach server.py. Start it with: python3 server.py"));
</script>
</body>
</html>
